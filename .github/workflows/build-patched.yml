name: Build patched APKs

# Applies outertune-sync-artwork-lyrics.patch on top of the checked-out source and builds
# the variant you choose. Nothing needs to be cloned locally: the runner does the checkout,
# including the media3 submodule that settings.gradle.kts requires.
#
# Setup: upload outertune-sync-artwork-lyrics.patch to the repository root, then run this
# workflow from the Actions tab.
#
# SIGNING
# -------
# The release and userdebug build types use the project's "ot_release" signing config, which
# is empty unless a keystore.properties exists. An unsigned APK will not install, so this
# workflow always supplies a key:
#
#   * If repository secrets KEYSTORE (base64 of a .jks) and KEYSTORE_PROPERTIES are set,
#     those are used. The signature stays stable across builds, so each new build installs
#     over the previous one and keeps its data.
#
#   * Otherwise a throwaway keystore is generated for that run. The APK installs fine, but
#     every build gets a DIFFERENT signature, so you must uninstall the previous build before
#     installing a new one — which wipes that app's library and settings. Back up first via
#     Settings -> Backup and restore.
#
# Debug builds ignore all of this: they are signed with the standard Android debug key and
# carry a .debug applicationId suffix, so they install alongside anything else.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which variant to build"
        required: true
        default: "fullUserdebug"
        type: choice
        options:
          - fullDebug
          - coreDebug
          - fullUserdebug
          - coreUserdebug
          - fullRelease
          - coreRelease
      patch_file:
        description: "Patch file in the repo root to apply"
        required: true
        default: "outertune-sync-artwork-lyrics.patch"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source (with media3 submodule)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply patch
        run: |
          set -e
          PATCH="${{ inputs.patch_file }}"
          if [ ! -f "$PATCH" ]; then
            echo "::error::$PATCH not found in the repository root."
            echo "Upload the patch file to the root of this repo, then re-run."
            exit 1
          fi

          # Everything needed to tell a bad base apart from a bad patch file, printed before
          # anything can go wrong. The expected sha256 is the one for the 19-commit patch; if
          # it differs, the file in this repo is not the file that was generated.
          echo "===== BASE ====="
          git rev-parse HEAD
          git log --oneline -3
          echo "===== PATCH FILE ====="
          sha256sum "$PATCH"
          echo "expected: aaed720d22446f4f65f191b8a8146b6c63184422064815f673ede5007a7960a0"
          echo "lines: $(wc -l < "$PATCH")  (expected 6005)   bytes: $(wc -c < "$PATCH")  (expected 276911)"
          echo "commits in patch: $(grep -c '^From ' "$PATCH")  (expected 19)"
          echo "================"

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          export GIT_EDITOR=true

          # The link-redirect commit is the one commit here whose intent does not depend on the
          # exact surrounding lines: it rewrites a URL wherever that URL appears. Expressed as a
          # diff it is fragile - any drift in About/SetupWizard upstream breaks the context and
          # git gives up. So when that specific commit conflicts, re-do it as the search and
          # replace it always was, against whatever this checkout actually contains.
          # OuterTune/ffMetadataEx does not match the pattern, so it is left pointing upstream.
          resolve_links() {
            echo "::notice::Applying the link redirect as a search-and-replace against this checkout."
            git diff --name-only --diff-filter=U | while read -r f; do
              git checkout --ours -- "$f" 2>/dev/null || true
            done
            grep -rlI "github\.com/OuterTune/OuterTune" app/src/main 2>/dev/null | while read -r f; do
              sed -i "s|github\.com/OuterTune/OuterTune|github.com/notK50BML/OuterTune|g" "$f"
            done
            git add -A
            if git diff --cached --quiet; then git am --skip; else git am --continue; fi
          }

          # A commit that is already present in this checkout is not an error - it just has
          # nothing left to do. Detect that case (the diff reverse-applies cleanly, meaning the
          # tree already contains it) and skip it, rather than stopping the whole build.
          applied=0
          if git am --3way --whitespace=nowarn "$PATCH"; then
            applied=1
          else
            for _ in $(seq 1 25); do
              git am --show-current-patch=diff > /tmp/current.diff 2>/dev/null || true
              subject="$(git am --show-current-patch 2>/dev/null | sed -n 's/^Subject: //p' | head -1)"

              if [ -s /tmp/current.diff ] && git apply --check --reverse /tmp/current.diff 2>/dev/null; then
                echo "::notice::Already present in this checkout, skipping: $subject"
                if git am --skip; then applied=1; break; fi
                continue
              fi

              case "$subject" in
                *"Point in-app links at this fork"*)
                  if resolve_links; then applied=1; break; fi
                  continue
                  ;;
              esac

              echo "::error::Patch did not apply. Failing commit: $subject"
              echo "----- what the tree looks like now -----"
              git status --short
              echo "----- the diff that would not apply -----"
              cat /tmp/current.diff
              git am --abort || true
              exit 1
            done
          fi

          if [ "$applied" != "1" ]; then
            echo "::error::Gave up after 25 skips - the base does not resemble the patch's base."
            git am --abort || true
            exit 1
          fi

          echo "Applied commits:"
          git log --oneline -8

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Set up signing key
        if: ${{ !contains(inputs.variant, 'Debug') }}
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          set -e
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            echo "Using the keystore from repository secrets (stable signature)."
            echo "$KEYSTORE" | base64 --decode > release.jks
            echo "$KEYSTORE_PROPERTIES" > keystore.properties
          else
            echo "::warning::No KEYSTORE secret found. Generating a throwaway key for this run."
            echo "::warning::This build's signature differs from every other build, so you must"
            echo "::warning::uninstall the previous APK before installing this one (that erases"
            echo "::warning::its library and settings — back up first)."
            PASS="$(openssl rand -hex 24)"
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias outertune \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=OuterTune, O=OuterTune, C=US" \
              -noprompt
            {
              echo "storeFile=../release.jks"
              echo "keyAlias=outertune"
              echo "storePassword=$PASS"
              echo "keyPassword=$PASS"
            } > keystore.properties
          fi
          # keystore.properties resolves storeFile relative to the app module, so anchor it
          # at the repo root regardless of which branch of the above ran.
          sed -i "s|^storeFile=.*|storeFile=$GITHUB_WORKSPACE/release.jks|" keystore.properties

      # Lint and unit tests are deliberately skipped: a lint warning should not stop an APK
      # from being produced.
      - name: Build ${{ inputs.variant }}
        run: ./gradlew assemble${{ inputs.variant }} --stacktrace -DskipFormatKtlint

      - name: Remove signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: outertune-${{ inputs.variant }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
