name: Build patched APKs

# Applies outertune-sync-artwork-lyrics.patch on top of the checked-out source and
# builds both flavours. Nothing needs to be cloned locally: the runner does the
# checkout, including the media3 submodule that the app's settings.gradle.kts requires.
#
# Upload outertune-sync-artwork-lyrics.patch to the repository root, then run this
# workflow from the Actions tab (Run workflow).

on:
  workflow_dispatch:
    inputs:
      patch_file:
        description: "Patch file in the repo root to apply"
        required: true
        default: "outertune-sync-artwork-lyrics.patch"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source (with media3 submodule)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply patch
        run: |
          set -e
          if [ ! -f "${{ inputs.patch_file }}" ]; then
            echo "::error::${{ inputs.patch_file }} not found in the repository root."
            echo "Upload the patch file to the root of this repo, then re-run."
            exit 1
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if ! git am --3way "${{ inputs.patch_file }}"; then
            echo "::error::Patch did not apply cleanly. Conflicting hunks:"
            git am --show-current-patch=diff || true
            git am --abort || true
            exit 1
          fi
          echo "Applied commits:"
          git log --oneline -6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      # Debug build type, so the APKs are signed with the standard Android debug key and
      # will actually install. They carry the .debug applicationId suffix, which means they
      # sit alongside an existing OuterTune install rather than replacing it.
      #
      # "full" links the checked-in prebuilt/ffMetadataEx-release.aar for FFmpeg decoding;
      # "core" compiles the stub instead. Both are built here.
      #
      # Lint and unit tests are deliberately not run: a lint warning should not stop an
      # APK from being produced on a first build.
      - name: Build core + full debug APKs
        run: ./gradlew assembleCoreDebug assembleFullDebug --stacktrace -DskipFormatKtlint

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: outertune-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
