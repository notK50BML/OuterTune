name: Build new APKs

# Applies outertune-backlog.patch on top of the checked-out source and builds
# the variant you choose. Nothing needs to be cloned locally: the runner does the checkout,
# including the media3 submodule that settings.gradle.kts requires.
#
# Setup: upload outertune-backlog.patch to the repository root, then run this
# workflow from the Actions tab.
#
# SIGNING
# -------
# The release and userdebug build types use the project's "ot_release" signing config, which
# is empty unless a keystore.properties exists. An unsigned APK will not install, so this
# workflow always supplies a key:
#
#   * If repository secrets KEYSTORE (base64 of a .jks) and KEYSTORE_PROPERTIES are set,
#     those are used. The signature stays stable across builds, so each new build installs
#     over the previous one and keeps its data.
#
#   * Otherwise a throwaway keystore is generated for that run. The APK installs fine, but
#     every build gets a DIFFERENT signature, so you must uninstall the previous build before
#     installing a new one — which wipes that app's library and settings. Back up first via
#     Settings -> Backup and restore.
#
# Debug builds ignore all of this: they are signed with the standard Android debug key and
# carry a .debug applicationId suffix, so they install alongside anything else.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which variant to build"
        required: true
        default: "coreRelease"
        type: choice
        options:
          - fullDebug
          - coreDebug
          - fullUserdebug
          - coreUserdebug
          - fullRelease
          - coreRelease
      patch_file:
        description: "Patch file in the repo root to apply"
        required: true
        default: "outertune-metrolist-engine.patch"
      version_name:
        description: "versionName (blank = same as the last build)"
        required: false
        default: ""
      version_code:
        description: "versionCode (blank = one higher than the last build). Android refuses an upgrade whose code is not higher than the installed one."
        required: false
        default: ""
      locales:
        description: "Languages to keep, comma separated (e.g. en,ja,zh-rCN). Blank keeps all 50, which is about 1.4MB of strings."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source (with media3 submodule)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply patch
        run: |
          set -e
          PATCH="${{ inputs.patch_file }}"
          if [ ! -f "$PATCH" ]; then
            echo "::error::$PATCH not found in the repository root."
            echo "Upload the patch file to the root of this repo, then re-run."
            exit 1
          fi

          # Everything needed to tell a bad base apart from a bad patch file, printed before
          # anything can go wrong. Measured, never hardcoded: an expected size written down by
          # hand goes stale the first time the patch is regenerated, and then it reports every
          # correct patch as wrong - which is worse than not checking at all.
          echo "===== BASE ====="
          git rev-parse HEAD
          git log --oneline -3
          echo "===== PATCH FILE ====="
          sha256sum "$PATCH"
          echo "commits: $(grep -c '^From ' "$PATCH")   lines: $(wc -l < "$PATCH")   bytes: $(wc -c < "$PATCH")"

          # git format-patch --base records the commit the patch was built against. Checking it
          # turns the single most common failure into one line instead of a wall of rejected diff:
          # the patch is fine, this checkout is simply not where it starts from.
          #
          # That happens for an ordinary reason. This workflow is dispatched against a branch, and
          # a branch that already contains the patch's commits is not a valid base for replaying
          # them - every commit would be "already present", and the skip loop below would run out
          # long before it reached the end.
          WANT_BASE="$(sed -n 's/^base-commit: //p' "$PATCH" | tail -1)"
          if [ -n "$WANT_BASE" ]; then
            echo "patch base: $WANT_BASE"
            if ! git cat-file -e "${WANT_BASE}^{commit}" 2>/dev/null; then
              echo "::error::This checkout does not contain the commit this patch was built on."
              echo "::error::Wanted $WANT_BASE - it is not in this repository's history."
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$WANT_BASE" ]; then
              echo "::notice::HEAD is $(git rev-parse --short HEAD); the patch starts from $(git rev-parse --short "$WANT_BASE"). Moving there."
              # Copied out first: the base predates the patch file being tracked, so resetting to
              # it would delete the very file about to be applied.
              cp "$PATCH" /tmp/patch.mbox
              git reset --hard "$WANT_BASE"
              PATCH=/tmp/patch.mbox
            fi
          else
            echo "patch declares no base commit - applying against this checkout as-is."
          fi
          echo "================"

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          export GIT_EDITOR=true

          # The link-redirect commit is the one commit here whose intent does not depend on the
          # exact surrounding lines: it rewrites a URL wherever that URL appears. Expressed as a
          # diff it is fragile - any drift in About/SetupWizard upstream breaks the context and
          # git gives up. So when that specific commit conflicts, re-do it as the search and
          # replace it always was, against whatever this checkout actually contains.
          # OuterTune/ffMetadataEx does not match the pattern, so it is left pointing upstream.
          resolve_links() {
            echo "::notice::Applying the link redirect as a search-and-replace against this checkout."
            git diff --name-only --diff-filter=U | while read -r f; do
              git checkout --ours -- "$f" 2>/dev/null || true
            done
            grep -rlI "github\.com/OuterTune/OuterTune" app/src/main 2>/dev/null | while read -r f; do
              sed -i "s|github\.com/OuterTune/OuterTune|github.com/notK50BML/OuterTune|g" "$f"
            done
            git add -A
            if git diff --cached --quiet; then git am --skip; else git am --continue; fi
          }

          # The version bump is the one commit whose result is decided later anyway, by the
          # "Set version" step below. So when its diff will not merge - and on a fork whose
          # build.gradle.kts has moved it will not, git says "sha1 information is lacking or
          # useless" - there is nothing worth reconstructing. Step over it.
          resolve_version() {
            echo "::notice::Skipping the version commit; the version is set explicitly below."
            git diff --name-only --diff-filter=U | while read -r f; do
              git checkout --ours -- "$f" 2>/dev/null || true
            done
            git checkout -- . 2>/dev/null || true
            git am --skip
          }

          # --keep-cr matters: at least one tracked file's own line-ending convention is CRLF, so
          # its diff hunks carry a real \r as part of the content being matched/added, not just as
          # mail-transport noise. Without this flag, git am's mailbox parser strips that \r before
          # the patch ever reaches the apply step, so the search pattern silently stops matching
          # the (still-CRLF) file in the tree and the patch is rejected as "does not apply" even
          # though the diff itself is byte-correct.
          #
          # A commit that is already present in this checkout is not an error - it just has
          # nothing left to do. Detect that case (the diff reverse-applies cleanly, meaning the
          # tree already contains it) and skip it, rather than stopping the whole build.
          applied=0
          if git am --keep-cr --3way --whitespace=nowarn "$PATCH"; then
            applied=1
          else
            for _ in $(seq 1 25); do
              git am --show-current-patch=diff > /tmp/current.diff 2>/dev/null || true
              subject="$(git am --show-current-patch 2>/dev/null | sed -n 's/^Subject: //p' | head -1)"

              # Only when nothing is left conflicted. A half-merged file can contain enough of
              # the patch for the reverse-apply test to pass, and skipping on that basis drops a
              # commit that never actually landed - which then breaks everything built on it.
              unmerged="$(git diff --name-only --diff-filter=U)"
              if [ -z "$unmerged" ] && [ -s /tmp/current.diff ] && git apply --check --reverse /tmp/current.diff 2>/dev/null; then
                echo "::notice::Already present in this checkout, skipping: $subject"
                if git am --skip; then applied=1; break; fi
                continue
              fi

              case "$subject" in
                *"Point in-app links at this fork"*)
                  if resolve_links; then applied=1; break; fi
                  continue
                  ;;
                *"Bump to 0.10.18"*)
                  if resolve_version; then applied=1; break; fi
                  continue
                  ;;
              esac

              echo "::error::Patch did not apply. Failing commit: $subject"
              echo "----- what the tree looks like now -----"
              git status --short
              echo "----- the diff that would not apply -----"
              cat /tmp/current.diff
              git am --abort || true
              exit 1
            done
          fi

          if [ "$applied" != "1" ]; then
            echo "::error::Gave up after 25 skips - the base does not resemble the patch's base."
            git am --abort || true
            exit 1
          fi

          echo "Applied commits:"
          git log --oneline -8

      # What the last successful run of this workflow called itself. Restored by prefix rather than
      # by an exact key, so it always finds the most recent one without anybody having to know its
      # number. A miss is not a failure - the step below falls back to what the patch declares.
      #
      # Caches are scoped to the branch that wrote them, so running this from a branch that has
      # never built starts its own count rather than inheriting the default branch's.
      - name: Recall the last build's version
        uses: actions/cache/restore@v4
        with:
          path: .build-version
          key: otver-build-patched-backlog-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            otver-build-patched-backlog-

      # One place decides what this build calls itself.
      #
      # Left blank, both inputs continue from the previous build: the same name, one higher code.
      # That is the point - Android refuses to install an upgrade whose versionCode is not higher
      # than the installed one, and a number typed from memory is precisely the thing that gets that
      # wrong. Filling either in overrides it for this run, and the next run continues from there.
      - name: Set version
        id: version
        run: |
          set -e
          # What the patched tree declares, as both the floor and the fallback.
          TREE_NAME="$(sed -nE 's/^[[:space:]]*versionName = "(.*)"/\1/p' app/build.gradle.kts | head -1)"
          TREE_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)/\1/p' app/build.gradle.kts | head -1)"
          TREE_CODE="${TREE_CODE:-0}"

          # What the previous run recorded, if the cache had it.
          PREV_NAME="$(sed -n 's/^name=//p' .build-version 2>/dev/null | head -1)"
          PREV_CODE="$(sed -n 's/^code=//p' .build-version 2>/dev/null | head -1)"

          if [ -n "$PREV_CODE" ]; then
            PREVIOUS="${PREV_NAME:-?} (code $PREV_CODE)"
          else
            PREVIOUS="none recorded, starting from the patch ($TREE_NAME, code $TREE_CODE)"
          fi

          NAME="${{ inputs.version_name }}"
          [ -n "$NAME" ] || NAME="${PREV_NAME:-$TREE_NAME}"

          CODE="${{ inputs.version_code }}"
          if [ -z "$CODE" ]; then
            # The floor applies only when the number is derived, never when it was asked for: a
            # patch that raises the version itself must not be silently undone by a stale count,
            # while an explicit number is a deliberate choice and is left exactly as given.
            BASE="${PREV_CODE:-$TREE_CODE}"
            [ "$TREE_CODE" -gt "$BASE" ] && BASE="$TREE_CODE"
            CODE=$((BASE + 1))
          fi

          sed -i -E "s/^([[:space:]]*)versionName = .*/\1versionName = \"$NAME\"/" app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*)versionCode = .*/\1versionCode = $CODE/" app/build.gradle.kts

          # Written now rather than after the build, but the save step is conditional on success -
          # so a build that fails never burns a version number.
          printf 'name=%s\ncode=%s\n' "$NAME" "$CODE" > .build-version

          {
            echo "name=$NAME"
            echo "code=$CODE"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"

          echo "Previous build: $PREVIOUS"
          echo "This build:     $NAME (code $CODE)"
          grep -nE "version(Code|Name) = " app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          # setup-java's own Gradle cache hashing has been seen tripping over a
          # "no such file or directory, realpath '.../.git/objects/xx'" ENOENT on this repo's
          # history - a cache-key-hashing bug, not anything about the checkout itself. Caching is
          # a speed nicety, not a correctness requirement, so it's simplest to just not depend on
          # that code path at all rather than chase a transient runner-side glitch.

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Set up signing key
        if: ${{ !contains(inputs.variant, 'Debug') }}
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          set -e
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            echo "Using the keystore from repository secrets (stable signature)."
            echo "$KEYSTORE" | base64 --decode > release.jks
            echo "$KEYSTORE_PROPERTIES" > keystore.properties
          else
            echo "::warning::No KEYSTORE secret found. Generating a throwaway key for this run."
            echo "::warning::This build's signature differs from every other build, so you must"
            echo "::warning::uninstall the previous APK before installing this one (that erases"
            echo "::warning::its library and settings — back up first)."
            PASS="$(openssl rand -hex 24)"
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias outertune \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=OuterTune, O=OuterTune, C=US" \
              -noprompt
            {
              echo "storeFile=../release.jks"
              echo "keyAlias=outertune"
              echo "storePassword=$PASS"
              echo "keyPassword=$PASS"
            } > keystore.properties
          fi
          # keystore.properties resolves storeFile relative to the app module, so anchor it
          # at the repo root regardless of which branch of the above ran.
          sed -i "s|^storeFile=.*|storeFile=$GITHUB_WORKSPACE/release.jks|" keystore.properties

      # Lint and unit tests are deliberately skipped: a lint warning should not stop an APK
      # from being produced.
      - name: Build ${{ inputs.variant }}
        run: |
          set -o pipefail

          # The app is translated into 50 languages and ships all of them by default, which is right
          # for a release anyone might install and roughly 1.4MB of strings nobody asked for in a
          # build made for one person. The Gradle side has always supported filtering; nothing
          # exposed it.
          #
          # English is added by the build whatever is asked for, since it is the base resource -
          # dropping it would leave any string a chosen language happens not to translate with
          # nothing to fall back to.
          GRADLE_ARGS=""
          if [ -n "${{ inputs.locales }}" ]; then
            GRADLE_ARGS="-Plocales=${{ inputs.locales }}"
            echo "::notice::Keeping only these languages: ${{ inputs.locales }} (plus English)"
          fi

          ./gradlew assemble${{ inputs.variant }} $GRADLE_ARGS --stacktrace -DskipFormatKtlint 2>&1 | tee build.log

      # Gradle prints compiler errors early and then buries them under a stack trace hundreds of
      # lines long, so neither end of a failed log contains them. Put them somewhere that needs no
      # scrolling at all: the run's summary page, and red annotations at the top of it.
      # Reports why the job failed. It must never fail itself: this step runs only when something
      # has already gone wrong, and a reporter that dies takes the real cause off the screen and
      # replaces it with its own error. That is exactly what used to happen, in two ways.
      - name: What actually failed
        if: failure()
        # No -e. A diagnostic that aborts on the first command returning non-zero is a diagnostic
        # that stops working the moment there is nothing to find.
        shell: bash {0}
        run: |
          # The build step writes build.log, so its absence means the build never started and the
          # failure is upstream - the patch, the SDK licences, the signing key. Grepping a file
          # that was never created reported "No such file or directory" as though the missing log
          # were the problem, which is the least useful thing it could have said.
          if [ ! -f build.log ]; then
            {
              echo "## Failed before the build started"
              echo
              echo "There is no \`build.log\`, so the Build step never ran and the compiler was"
              echo "never involved. The cause is in an earlier step - open the first red one above."
              echo "Most often that is **Apply patch**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The build never started - the failure is in an earlier step. Check Apply patch."
            echo "No build.log: the build never ran. See the first failed step above."
            # Zero on purpose. The job is already failing because of the step that actually broke;
            # failing again here would only add a second, misleading entry on top of it.
            exit 0
          fi

          ERRORS="$(grep -aE '^e: |^error: |^ERROR: ' build.log | head -60)"
          TASKS="$(grep -aE '^> Task .* FAILED' build.log | head -20)"

          {
            echo "## Build failed"
            echo
            if [ -n "$TASKS" ]; then
              echo '```'
              echo "$TASKS"
              echo '```'
            fi
            if [ -n "$ERRORS" ]; then
              echo "### Compiler errors"
              echo '```'
              echo "$ERRORS"
              echo '```'
            else
              echo "No compiler errors in the log - the failure was somewhere else."
              echo
              echo "Last 40 lines of the build:"
              echo '```'
              tail -40 build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Also as annotations, which GitHub pins to the top of the run page in red.
          #
          # Guarded by the emptiness check rather than looping over nothing. Piping an empty string
          # into the loop still yields one blank line, and `[ -n "$line" ] && echo` then returns 1
          # for it - the loop body's last command, so the loop failed, so the pipeline failed, and
          # under `set -e` the whole step died. Which meant this reporter broke in precisely the
          # case it exists for: a failure that is not a compiler error.
          if [ -n "$ERRORS" ]; then
            printf '%s\n' "$ERRORS" | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::$line"; fi
            done
          fi

          echo "================== COMPILER ERRORS =================="
          echo "${ERRORS:-(none)}"
          echo "===================================================="

      # Only on success, so a failed build does not consume a version number and leave a gap.
      - name: Remember this version for the next build
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .build-version
          key: otver-build-patched-backlog-${{ github.run_number }}-${{ github.run_attempt }}

      # What this run actually produced, on the run's summary page and as a notice pinned to the
      # top of it. Without this, the only way to find out which version an APK is, is to download
      # it and read the filename.
      - name: Build notice
        if: success()
        run: |
          set -e
          NAME="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"
          echo "::notice::OuterTune $NAME, versionCode $CODE (${{ inputs.variant }}) - previous build was ${{ steps.version.outputs.previous }}"
          {
            echo "## OuterTune $NAME - versionCode $CODE"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version name | \`$NAME\` |"
            echo "| Version code | \`$CODE\` |"
            echo "| Previous build | ${{ steps.version.outputs.previous }} |"
            echo "| Variant | \`${{ inputs.variant }}\` |"
            echo "| Patch | \`${{ inputs.patch_file }}\` |"
            if [ -n "${{ inputs.locales }}" ]; then
              echo "| Languages | \`${{ inputs.locales }}\` + English |"
            else
              echo "| Languages | all 50 |"
            fi
            echo "| Workflow run | #${{ github.run_number }} |"
            echo
            echo "### APKs"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            find app/build/outputs/apk -name '*.apk' | sort | while IFS= read -r apk; do
              printf '| `%s` | %s |\n' "$(basename "$apk")" "$(du -h "$apk" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f release.jks keystore.properties

      # The version is in the artifact name as well as inside the APKs, so several downloads
      # sitting in the same folder can still be told apart.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: outertune-${{ inputs.variant }}-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build.log
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
