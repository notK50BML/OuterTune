## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Nov 19 15:59:34 CST 2022

# 6GB for Gradle itself, where R8 runs: it is the most memory-hungry step of a release build and
# spends much of its time collecting garbage when held to 4GB. GitHub's runners have 16GB.
org.gradle.jvmargs=-Xmx6144M -Dkotlin.daemon.jvm.options\="-Xmx4096M"
# Modules that do not depend on each other (media3's libraries, innertube, kizzy, ...) compile at
# the same time rather than one after another.
org.gradle.parallel=true
# A task whose inputs have not changed reuses its previous output instead of running again. On CI
# this is what setup-gradle persists between runs.
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# AGP 9.0 enables built-in Kotlin (android.builtInKotlin) by default, which
# forbids the standalone org.jetbrains.kotlin.android plugin. The media
# submodule (AGP 9.0.0) keeps the standalone plugin via these flags, so match
# it here to avoid the larger built-in-Kotlin migration.
android.builtInKotlin=false
android.newDsl=false
